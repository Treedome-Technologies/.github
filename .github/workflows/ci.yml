# CI: the required checks for main (baseline gates plus actionlint for the shared workflows).
# The shared workflows come from nathanzm/.github at @main; that repo holds the pins.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    uses: nathanzm/.github/.github/workflows/baseline.yml@main

  actionlint:
    uses: nathanzm/.github/.github/workflows/actionlint.yml@main
